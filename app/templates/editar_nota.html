{% extends "base.html" %}
{% block title %}Editar nota{% endblock %}
{% block content %}
<h4 class="mb-3">Editar nota</h4>
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <label class="form-label">Arquivo Principal Atual</label>
          <div>
            <a href="{{ url_for('notas.baixar_arquivo', nota_id=nota.id) }}" target="_blank" class="btn btn-sm btn-outline-secondary mb-2">
              <i class="fa-solid fa-file-pdf me-1"></i> {{ nota.arquivo_nome_original }}
            </a>
          </div>
          <label class="form-label small">Substituir Arquivo Principal (Opcional)</label>
          <input type="file" name="arquivo" class="form-control" accept=".pdf,image/*" capture="environment">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Comprovante de Pagamento / PIX</label>
          <div>
            {% if nota.comprovante_nome %}
            <a href="{{ url_for('notas.baixar_comprovante', nota_id=nota.id) }}" target="_blank" class="btn btn-sm btn-outline-success mb-2">
              <i class="fa-solid fa-receipt me-1"></i> {{ nota.comprovante_nome_original or 'Ver Comprovante' }}
            </a>
            {% else %}
            <span class="badge bg-secondary mb-2">Nenhum comprovante anexado</span>
            {% endif %}
          </div>
          <label class="form-label small">Anexar / Substituir Comprovante (Opcional)</label>
          <input type="file" name="comprovante" class="form-control" accept=".pdf,image/*" capture="environment">
        </div>
      </div>


      <div class="row g-3">
        <div class="col-6">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select">
            <option value="entrada" {% if nota.tipo == 'entrada' %}selected{% endif %}>Entrada (venda)</option>
            <option value="saida" {% if nota.tipo == 'saida' %}selected{% endif %}>Saída (compra/despesa)</option>
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">Categoria</label>
          <select name="categoria" class="form-select">
            {% for c in categorias %}
            <option value="{{ c }}" {% if nota.categoria == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">Tipo de documento</label>
          <select name="tipo_documento" class="form-select">
            {% for td in tipos_documento %}
            <option value="{{ td }}" {% if (nota.tipo_documento or 'Outro') == td %}selected{% endif %}>{{ td }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">Número da nota</label>
          <input type="text" name="numero_nota" class="form-control" value="{{ nota.numero_nota or '' }}">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Data de emissão</label>
          <input type="date" name="data_emissao" class="form-control" value="{{ nota.data_emissao.isoformat() }}" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Data de vencimento</label>
          <input type="date" name="data_vencimento" class="form-control" value="{{ nota.data_vencimento.isoformat() if nota.data_vencimento else '' }}">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Data de pagamento/rec.</label>
          <input type="date" name="data_pagamento" class="form-control" value="{{ nota.data_pagamento.isoformat() if nota.data_pagamento else '' }}">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            {% for st in status_financeiro %}
            <option value="{{ st }}" {% if (nota.status or 'Pendente') == st %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-8 col-md-8">
          <label class="form-label">Cliente / Fornecedor</label>
          <input type="text" name="cliente_fornecedor" class="form-control" value="{{ nota.cliente_fornecedor or '' }}">
        </div>
        <div class="col-4 col-md-4">
          <label class="form-label">Valor (R$)</label>
          <input type="text" name="valor" class="form-control" value="{{ nota.valor }}" required>
        </div>
        <div class="col-12">
          <label class="form-label">Observações / Detalhes</label>
          <textarea name="descricao" class="form-control" rows="2">{{ nota.descricao or '' }}</textarea>
        </div>

      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary flex-fill">Salvar alterações</button>
      </div>
    </form>

    <form method="post" action="{{ url_for('notas.excluir', nota_id=nota.id) }}"
          onsubmit="return confirm('Tem certeza que deseja excluir esta nota?');" class="mt-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-outline-danger w-100">Excluir nota</button>
    </form>
  </div>
</div>
{% endblock %}
